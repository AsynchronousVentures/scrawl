# Isolated, disposable development Demo A database. Never a deployment definition.
# Use: docker compose --env-file .env.demo -f compose.demo.yaml up -d --wait
# Existing PostgreSQL 17 data uses compose.demo.postgres17.yaml and its original project.
name: scrawl-demo-a18
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run demo:init first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run demo:init first}
      POSTGRES_DB: scrawl_demo_a
    ports:
      - "127.0.0.1:${DEMO_DB_PORT:-5434}:5432"
    volumes:
      - demo_postgres18_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  demo_postgres18_data:
